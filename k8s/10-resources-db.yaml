apiVersion: v1
kind: PersistentVolume
metadata:
  name: resources-db-pv
  labels:
    app: resources-db
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  hostPath:
    path: /data/k8s-application/resources-db
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: resources-db-pvc
  namespace: k8s-application
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: manual
  resources:
    requests:
      storage: 1Gi
  selector:
    matchLabels:
      app: resources-db
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: resources-db
  namespace: k8s-application
spec:
  serviceName: resources-db
  replicas: 1
  selector:
    matchLabels:
      app: resources-db
  template:
    metadata:
      labels:
        app: resources-db
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: db-credentials
          volumeMounts:
            - name: resources-db-storage
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: resources-db-storage
          persistentVolumeClaim:
            claimName: resources-db-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: resources-db
  namespace: k8s-application
spec:
  clusterIP: None
  selector:
    app: resources-db
  ports:
    - port: 5432
      targetPort: 5432
