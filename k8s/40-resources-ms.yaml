apiVersion: apps/v1
kind: Deployment
metadata:
  name: resources-ms
  namespace: k8s-application
spec:
  replicas: 1
  selector:
    matchLabels:
      app: resources-ms
  template:
    metadata:
      labels:
        app: resources-ms
    spec:
      containers:
        - name: resources-ms
          image: resources-image:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: app-config
---
apiVersion: v1
kind: Service
metadata:
  name: resources-ms
  namespace: k8s-application
spec:
  selector:
    app: resources-ms
  ports:
    - port: 8080
      targetPort: 8080
