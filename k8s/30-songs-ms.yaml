apiVersion: v1
kind: PersistentVolume
metadata:
  name: songs-ms-pv
  labels:
    app: songs-ms
spec:
  capacity:
    storage: 100Mi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  hostPath:
    path: /data/k8s-application/songs-ms
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: songs-ms-pvc
  namespace: k8s-application
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: manual
  resources:
    requests:
      storage: 100Mi
  selector:
    matchLabels:
      app: songs-ms
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: songs-ms
  namespace: k8s-application
spec:
  replicas: 1
  selector:
    matchLabels:
      app: songs-ms
  template:
    metadata:
      labels:
        app: songs-ms
    spec:
      containers:
        - name: songs-ms
          image: songs-image:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: app-config
          volumeMounts:
            - name: songs-ms-storage
              mountPath: /mnt/songs-ms-data
      volumes:
        - name: songs-ms-storage
          persistentVolumeClaim:
            claimName: songs-ms-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: songs-ms
  namespace: k8s-application
spec:
  selector:
    app: songs-ms
  ports:
    - port: 8081
      targetPort: 8081
